# 실습 리뷰 실험 컨테이너 허용 목록 프록시 (실습리뷰쇼츠 H-D6, 메인 D46). CONNECT 443 만, filter 의 주소만
User nobody
Group nobody
Port 3128
Listen 172.31.250.2
Timeout 600
Allow 172.31.250.0/24
MaxClients 20
LogLevel Connect
DisableViaHeader Yes
ConnectPort 443
FilterDefaultDeny Yes
FilterType fnmatch
FilterURLs No
Filter "/etc/lab-egress/filter"
