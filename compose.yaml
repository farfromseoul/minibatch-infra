# MiniBatch 컨테이너 묶음 (compose 프로젝트 minibatch).
# - 기본: n8n만 뜬다.
# - app 프로필: job-api, tts-worker, render-worker (7단계에서 이미지를 만든 뒤)
# LLM 실행기(LM Studio)는 macOS에서 직접 실행하며 이 파일에 없다 (아키텍처 D1).
# 기기마다 다른 값은 .env 에만 둔다. 비밀 값은 파일(secrets, 바인드 마운트)로만 넘긴다.
name: minibatch

services:
  n8n:
    image: n8nio/n8n:${MINIBATCH_N8N_IMAGE_TAG:?MINIBATCH_N8N_IMAGE_TAG 를 .env 에 지정하세요}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Asia/Seoul
      TZ: Asia/Seoul
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key
    secrets:
      - n8n_encryption_key
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - edge

  job-api:
    profiles: ["app"]
    image: minibatch-job-api:${MINIBATCH_APP_IMAGE_TAG:-dev}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TZ: Asia/Seoul
      MINIBATCH_DATA_DIR: /data
      MINIBATCH_DB_PATH: /data/db/minibatch.sqlite
      # LLM·TTS·영상 생성기 선택과 주소는 providers.yaml 한 곳에서 정한다 (아키텍처 D19)
      MINIBATCH_PROVIDERS_FILE: /etc/minibatch/providers.yaml
      MINIBATCH_RENDER_WORKER_URL: http://render-worker:8091
      MINIBATCH_N8N_WEBHOOK_BASE_URL: http://n8n:5678/webhook
      MINIBATCH_DAILY_JOB_LIMIT: "${MINIBATCH_DAILY_JOB_LIMIT:-3}"
      MINIBATCH_REVIEW_BACKLOG_LIMIT: "6"
      MINIBATCH_DISK_FREE_WARN_GB: "50"
      MINIBATCH_JOB_API_TOKEN_FILE: /run/secrets/job_api_token
      MINIBATCH_YOUTUBE_CLIENT_FILE: /run/secrets/youtube_client
      MINIBATCH_YOUTUBE_TOKEN_FILE: /run/minibatch/youtube-token/youtube_token.json
    secrets:
      - job_api_token
      - youtube_client
    volumes:
      - ${MINIBATCH_DATA_DIR:?MINIBATCH_DATA_DIR 를 .env 에 지정하세요}:/data
      # 갱신 토큰은 job-api 가 다시 쓸 수 있어 secret(읽기 전용)이 아니라 폴더째 붙인다.
      # 폴더가 없으면 만들지 않고 실패한다 (host-prepare.sh 가 만든다)
      - type: bind
        source: ${MINIBATCH_SECRETS_DIR:?MINIBATCH_SECRETS_DIR 를 .env 에 지정하세요}/youtube-token
        target: /run/minibatch/youtube-token
        bind:
          create_host_path: false
      # 제공자 설정 (비밀 값 없음, 인프라 저장소에 커밋). 바꾼 뒤 job-api 만 다시 시작한다
      - type: bind
        source: ./config/providers.yaml
        target: /etc/minibatch/providers.yaml
        read_only: true
        bind:
          create_host_path: false
      # 영상 생성기·클라우드 LLM 키 폴더. 키가 없어도 compose 가 멈추지 않게 secret 대신 폴더째 붙인다
      - type: bind
        source: ${MINIBATCH_SECRETS_DIR:?MINIBATCH_SECRETS_DIR 를 .env 에 지정하세요}/providers
        target: /run/minibatch/providers
        read_only: true
        bind:
          create_host_path: false
    networks:
      - edge
      - internal
    depends_on:
      - tts-worker
      - render-worker

  tts-worker:
    profiles: ["app"]
    image: minibatch-tts-worker:${MINIBATCH_APP_IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      MINIBATCH_DATA_DIR: /data
    volumes:
      - ${MINIBATCH_DATA_DIR:?MINIBATCH_DATA_DIR 를 .env 에 지정하세요}:/data
    networks:
      - internal

  render-worker:
    profiles: ["app"]
    image: minibatch-render-worker:${MINIBATCH_APP_IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      MINIBATCH_DATA_DIR: /data
      MINIBATCH_RENDER_CONCURRENCY: "${MINIBATCH_RENDER_CONCURRENCY:-2}"
    volumes:
      - ${MINIBATCH_DATA_DIR:?MINIBATCH_DATA_DIR 를 .env 에 지정하세요}:/data
    networks:
      - internal

networks:
  # n8n과 job-api. 외부(YouTube)와 호스트(LM Studio)로 나갈 수 있다.
  edge: {}
  # 작업자 전용. 외부로 나가는 경로가 없다.
  internal:
    internal: true

volumes:
  n8n_data: {}

secrets:
  n8n_encryption_key:
    file: ${MINIBATCH_SECRETS_DIR:?MINIBATCH_SECRETS_DIR 를 .env 에 지정하세요}/n8n_encryption_key
  job_api_token:
    file: ${MINIBATCH_SECRETS_DIR:?MINIBATCH_SECRETS_DIR 를 .env 에 지정하세요}/job_api_token
  youtube_client:
    file: ${MINIBATCH_SECRETS_DIR:?MINIBATCH_SECRETS_DIR 를 .env 에 지정하세요}/youtube_client.json
